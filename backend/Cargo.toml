[package]
name = "relaypulse"
version = "3.0.1"
default-run = "relaypulse"
description = "RelayPulse desktop application"
edition = "2021"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[lib]
name = "relaypulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
relaypulse-runtime = { version = "0.1", path = "crates/runtime" }
relaypulse-storage = { version = "0.1", path = "crates/storage" }
relaypulse-diagnostics = { version = "0.1", path = "crates/diagnostics" }
relaypulse-model-client = { version = "0.1", path = "crates/model-client" }
relaypulse-operations = { version = "0.1", path = "crates/operations" }
relaypulse-notifications = { version = "0.1", path = "crates/notifications" }

futures-util = "0.3"
os_info = { version = "3.15", default-features = false }
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.39.0", features = ["bundled", "backup"] }
rusqlite_migration = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-notification = "2"
uuid = { version = "1", features = ["v4"] }
unicode-segmentation = "1.13.3"
zeroize = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "0.3.1"
tauri-nspanel = "=2.1.1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
relaypulse-storage = { version = "0.1",path="crates/storage",features= ["test-support"] }
relaypulse-model-client = { version = "0.1",path="crates/model-client",features= ["test-support"] }

tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["test-util"] }

[workspace]
resolver = "2"
members = [".", "crates/*"]
exclude = ["tests/integration/sdk"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
