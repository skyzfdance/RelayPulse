[package]
name = "relaypulse-diagnostics"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
relaypulse-runtime = { version = "0.1", path = "../runtime" }

[dev-dependencies]
relaypulse-storage = { version = "0.1",path="../storage", features = ["test-support"]}
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
