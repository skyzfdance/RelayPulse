[package]
name = "relaypulse-model-client"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
relaypulse-runtime = { version = "0.1",path="../runtime"}
futures-util = "0.3"
os_info = { version = "3.15", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[features]
test-support = []
