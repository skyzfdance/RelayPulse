[package]
name = "relaypulse-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
