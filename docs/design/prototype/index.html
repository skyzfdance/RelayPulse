<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RelayPulse UI</title>
  <style>
    :root {
      --primary: #1677ff;
      --primary-hover: #4096ff;
      --primary-bg: #e6f4ff;
      --success: #52c41a;
      --success-bg: #f6ffed;
      --warning: #faad14;
      --warning-bg: #fffbe6;
      --error: #ff4d4f;
      --error-bg: #fff2f0;
      --text: rgba(0, 0, 0, .88);
      --text-secondary: rgba(0, 0, 0, .65);
      --text-tertiary: rgba(0, 0, 0, .45);
      --border: #d9d9d9;
      --split: #f0f0f0;
      --fill: #f5f5f5;
      --fill-secondary: #fafafa;
      --white: #fff;
      --radius: 6px;
      --shadow: 0 6px 20px rgba(0, 0, 0, .10), 0 2px 8px rgba(0, 0, 0, .06);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--text);
      background: #eef1f5;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef1f5; font-size: 14px; letter-spacing: 0; }
    button, input, select, textarea { font: inherit; letter-spacing: 0; }
    button { cursor: default; }
    .screen { margin: 32px auto; background: var(--white); overflow: hidden; }
    .desktop { width: 1440px; height: 900px; border: 1px solid #dfe3e8; box-shadow: 0 12px 36px rgba(22, 34, 51, .10); }
    .titlebar { height: 52px; border-bottom: 1px solid var(--split); display: flex; align-items: center; padding: 0 16px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; min-width: 190px; }
    .brand-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 16px; line-height: 1; }
    .titlebar-center { color: var(--text-tertiary); flex: 1; text-align: center; font-size: 13px; }
    .titlebar-spacer { min-width: 190px; }
    .app-body { height: calc(100% - 52px); display: flex; }
    .nav { width: 216px; flex: 0 0 216px; background: var(--fill-secondary); border-right: 1px solid var(--split); padding: 16px 12px; display: flex; flex-direction: column; }
    .nav-section-label { color: var(--text-tertiary); font-size: 12px; padding: 8px 12px; }
    .nav-item { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; margin: 2px 0; border-radius: var(--radius); color: var(--text-secondary); }
    .nav-item.active { background: var(--primary-bg); color: var(--primary); font-weight: 500; }
    .nav-icon { width: 18px; text-align: center; font-size: 16px; }
    .nav-spacer { flex: 1; }
    .nav-version { color: var(--text-tertiary); font-size: 12px; padding: 10px 12px; }
    .content { min-width: 0; flex: 1; background: var(--white); position: relative; }
    .page-header { height: 76px; padding: 0 24px; border-bottom: 1px solid var(--split); display: flex; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; }
    h2 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; }
    h3 { margin: 0; font-size: 14px; line-height: 22px; font-weight: 600; }
    .subtitle { margin-top: 4px; color: var(--text-secondary); font-size: 13px; }
    .actions { display: flex; align-items: center; gap: 8px; }
    .btn { height: 32px; padding: 0 15px; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; color: var(--text); display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; }
    .btn.primary { color: #fff; background: var(--primary); border-color: var(--primary); }
    .btn.danger { color: var(--error); border-color: #ffccc7; }
    .btn.text { border-color: transparent; background: transparent; color: var(--primary); padding: 0 8px; }
    .btn.icon { width: 32px; padding: 0; color: var(--text-secondary); }
    .btn.small { height: 28px; padding: 0 11px; font-size: 13px; }
    .site-layout { height: calc(100% - 76px); display: flex; }
    .site-list { width: 300px; flex: 0 0 300px; background: var(--fill-secondary); border-right: 1px solid var(--split); padding: 16px 12px; }
    .site-list-head { display: flex; justify-content: space-between; align-items: center; padding: 0 4px 12px; }
    .site-count { color: var(--text-secondary); font-size: 13px; }
    .site-item { min-height: 66px; display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; padding: 10px 10px 10px 6px; margin-bottom: 6px; border: 1px solid transparent; border-radius: var(--radius); }
    .site-item.active { background: #fff; border-color: #91caff; box-shadow: 0 1px 3px rgba(22, 119, 255, .08); }
    .drag { color: #bfbfbf; font-size: 17px; }
    .site-name { font-weight: 500; display: flex; align-items: center; gap: 7px; }
    .site-meta { margin-top: 4px; color: var(--text-tertiary); font-size: 12px; }
    .priority { color: var(--text-tertiary); font-size: 11px; background: #f0f0f0; border-radius: 3px; padding: 1px 5px; }
    .switch { display: inline-block; width: 32px; height: 18px; border-radius: 10px; background: #bfbfbf; position: relative; flex: none; vertical-align: middle; }
    .switch::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: #fff; position: absolute; top: 2px; left: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
    .switch.on { background: var(--primary); }
    .switch.on::after { left: 16px; }
    .detail { flex: 1; min-width: 0; overflow: hidden; }
    .detail-scroll { height: 100%; padding: 14px 28px 10px; overflow: hidden; }
    .detail-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .title-group { display: flex; align-items: center; gap: 10px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .status-dot.success { background: var(--success); }
    .status-dot.warning { background: var(--warning); }
    .status-dot.error { background: var(--error); }
    .status-dot.muted { background: #bfbfbf; }
    .tag { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-secondary); background: #fafafa; font-size: 12px; white-space: nowrap; }
    .tag.blue { color: #0958d9; border-color: #91caff; background: var(--primary-bg); }
    .tag.green { color: #389e0d; border-color: #b7eb8f; background: var(--success-bg); }
    .tag.orange { color: #d46b08; border-color: #ffd591; background: #fff7e6; }
    .tag.red { color: #cf1322; border-color: #ffa39e; background: var(--error-bg); }
    .tag.gray { color: var(--text-tertiary); background: #f5f5f5; border-color: #e5e5e5; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }
    .field label { display: block; color: var(--text-secondary); font-size: 13px; margin-bottom: 6px; }
    .input, .select, .textarea { width: 100%; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; color: var(--text); }
    .input, .select { height: 34px; padding: 0 11px; }
    .textarea { height: 64px; resize: none; padding: 8px 11px; line-height: 20px; }
    .input.mono, .code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .section { padding: 18px 0; border-top: 1px solid var(--split); }
    .section:first-of-type { border-top: 0; }
    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .section-note { color: var(--text-tertiary); font-size: 12px; margin-top: 2px; }
    .strategy { background: var(--fill-secondary); border: 1px solid var(--split); border-radius: var(--radius); padding: 13px 14px; display: flex; align-items: center; gap: 12px; }
    .strategy-icon { width: 34px; height: 34px; border-radius: 6px; background: var(--primary-bg); color: var(--primary); display: grid; place-items: center; font-size: 17px; }
    .strategy-copy { flex: 1; }
    .strategy-name { font-weight: 500; }
    .strategy-meta { color: var(--text-secondary); font-size: 12px; margin-top: 3px; }
    .table { border: 1px solid var(--split); border-radius: var(--radius); overflow: hidden; }
    .tr { min-height: 48px; display: grid; align-items: center; padding: 0 12px; border-top: 1px solid var(--split); column-gap: 12px; }
    .tr:first-child { border-top: 0; }
    .tr.header { min-height: 38px; background: var(--fill-secondary); color: var(--text-secondary); font-size: 12px; }
    .model-table .tr { grid-template-columns: 58px 1.5fr .9fr .9fr .75fr .65fr; min-height: 42px; }
    .model-table .tr > :first-child { justify-self: center; }
    .model-name { font-weight: 500; }
    .muted { color: var(--text-tertiary); }
    .secondary { color: var(--text-secondary); }
    .link { color: var(--primary); }
    .effective-tip { margin-top: 12px; display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 12px; }
    .page-footer { position: absolute; right: 24px; bottom: 20px; display: flex; gap: 8px; }
    .detail .section { padding: 12px 0; }
    .detail .page-footer { position: static; justify-content: flex-end; margin-top: 10px; }
    .settings-wrap { padding: 22px 30px; max-width: 920px; }
    .settings-section { padding: 18px 0 22px; border-bottom: 1px solid var(--split); }
    .settings-section:first-child { padding-top: 0; }
    .settings-row { min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .settings-copy { max-width: 610px; }
    .settings-title { font-weight: 500; }
    .settings-help { margin-top: 4px; color: var(--text-tertiary); font-size: 12px; }
    .compact-select { width: 170px; }
    .segmented { height: 32px; background: #f0f0f0; border-radius: var(--radius); padding: 2px; display: flex; }
    .segment { min-width: 62px; padding: 0 12px; display: grid; place-items: center; color: var(--text-secondary); border-radius: 4px; font-size: 13px; }
    .segment.active { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.10); }
    .overlay { position: absolute; top: 0; right: 0; bottom: 0; left: -216px; background: rgba(0,0,0,.24); display: flex; align-items: center; justify-content: center; z-index: 10; }
    .modal { width: 560px; background: #fff; border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.08); overflow: hidden; }
    .modal.small-modal { width: 440px; }
    .modal-head { height: 56px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--split); }
    .modal-body { padding: 20px; }
    .modal-footer { height: 60px; border-top: 1px solid var(--split); display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 20px; }
    .close { color: var(--text-tertiary); font-size: 18px; }
    .modal .form-grid { grid-template-columns: 1fr; gap: 14px; }
    .check-row { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); }
    .checkbox { width: 16px; height: 16px; border: 1px solid var(--primary); background: var(--primary); border-radius: 3px; color: #fff; display: grid; place-items: center; font-size: 11px; }
    .danger-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--error-bg); color: var(--error); display: grid; place-items: center; font-size: 22px; }
    .confirm-body { display: flex; gap: 14px; }
    .confirm-copy p { margin: 6px 0 0; color: var(--text-secondary); line-height: 21px; }
    .drawer-overlay { position: absolute; top: 0; right: 0; bottom: 0; left: -216px; background: rgba(0,0,0,.24); z-index: 10; }
    .drawer { position: absolute; right: 0; top: 0; bottom: 0; width: 560px; background: #fff; box-shadow: -4px 0 12px rgba(0,0,0,.08); display: flex; flex-direction: column; }
    .drawer-head { height: 64px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--split); }
    .drawer-body { padding: 18px 20px; overflow: hidden; flex: 1; }
    .drawer-footer { height: 64px; border-top: 1px solid var(--split); display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 20px; }
    .radio-group { display: flex; gap: 0; }
    .radio-btn { height: 32px; border: 1px solid var(--border); padding: 0 15px; display: grid; place-items: center; color: var(--text-secondary); margin-left: -1px; }
    .radio-btn:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
    .radio-btn:last-child { border-radius: 0 6px 6px 0; }
    .radio-btn.active { color: var(--primary); border-color: var(--primary); position: relative; z-index: 1; background: var(--primary-bg); }
    .capability { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .param-table .tr { grid-template-columns: 1.05fr 1fr 76px 32px; min-height: 42px; }
    .mini-input { border: 1px solid var(--border); height: 28px; border-radius: 4px; padding: 0 8px; width: 100%; }
    .code-preview { background: #141414; color: #d6e4ff; border-radius: 6px; padding: 12px 14px; font-size: 12px; line-height: 19px; height: 128px; overflow: hidden; white-space: pre; }
    .drawer .drawer-body { padding: 8px 20px; }
    .drawer .section { padding: 9px 0; }
    .drawer .section-head { margin-bottom: 9px; }
    .drawer .code-preview { height: 132px; padding: 9px 12px; font-size: 11px; line-height: 14px; }
    .advanced-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
    .subtle-box { padding: 12px 14px; border: 1px solid var(--split); border-radius: var(--radius); background: var(--fill-secondary); }
    .key-table .tr { grid-template-columns: .8fr 1.3fr 32px; min-height: 42px; }
    .empty-wrap { height: calc(100% - 76px); display: grid; place-items: center; }
    .empty { text-align: center; width: 460px; }
    .empty-art { width: 112px; height: 84px; margin: 0 auto 18px; position: relative; }
    .empty-window { position: absolute; inset: 8px 4px 4px; border: 2px solid #d9d9d9; border-radius: 8px; background: #fafafa; }
    .empty-window::before { content: ""; position: absolute; top: 12px; left: 18px; right: 18px; height: 5px; background: #e8e8e8; box-shadow: 0 14px 0 #e8e8e8, 0 28px 0 #e8e8e8; }
    .empty-plus { position: absolute; right: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--primary-bg); color: var(--primary); display: grid; place-items: center; font-size: 20px; border: 2px solid #fff; }
    .empty p { color: var(--text-secondary); line-height: 22px; margin: 8px 0 18px; }
    .banner { padding: 9px 12px; border: 1px solid #ffe58f; background: var(--warning-bg); border-radius: var(--radius); color: #ad6800; display: flex; gap: 8px; font-size: 13px; margin-bottom: 16px; }

    /* Tray panel */
    .tray-stage { min-height: 100vh; display: grid; place-items: center; background: #edf0f4; padding: 32px; }
    .tray { background: #fff; border: 1px solid #e4e7eb; border-radius: 10px; box-shadow: 0 12px 40px rgba(28, 39, 55, .16), 0 2px 8px rgba(28,39,55,.08); overflow: hidden; }
    .tray.healthy { width: 368px; }
    .tray.alerts { width: 404px; }
    .tray-head { height: 52px; padding: 0 14px 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--split); }
    .tray-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .tray-actions { display: flex; gap: 4px; }
    .tray-main { padding: 18px 16px; }
    .healthy-line { display: flex; align-items: center; gap: 12px; }
    .state-light { width: 12px; height: 12px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 4px var(--success-bg); flex: none; }
    .state-light.warning { background: var(--warning); box-shadow: 0 0 0 4px var(--warning-bg); }
    .state-light.error { background: var(--error); box-shadow: 0 0 0 4px var(--error-bg); }
    .healthy-title { font-size: 18px; font-weight: 600; }
    .healthy-meta { margin-top: 4px; color: var(--text-secondary); font-size: 13px; }
    .tray-summary { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .summary-title { display: flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 600; }
    .summary-meta { color: var(--text-secondary); font-size: 12px; }
    .probe-row { display: grid; grid-template-columns: 1fr 66px 66px; column-gap: 10px; align-items: center; min-height: 62px; border-top: 1px solid var(--split); }
    .probe-row:first-of-type { border-top: 0; }
    .probe-id { display: flex; gap: 9px; align-items: flex-start; min-width: 0; }
    .probe-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .probe-site { color: var(--text-tertiary); font-size: 12px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .metric { text-align: right; }
    .metric-label { color: var(--text-tertiary); font-size: 11px; }
    .metric-value { margin-top: 3px; font-variant-numeric: tabular-nums; font-size: 13px; }
    .metric-value.bad { color: var(--error); }
    .metric-value.slow { color: #d48806; }
    .tray-link { height: 38px; display: grid; place-items: center; color: var(--primary); border-top: 1px solid var(--split); font-size: 13px; }
    .tray-foot { height: 42px; padding: 0 10px 0 16px; border-top: 1px solid var(--split); display: flex; align-items: center; justify-content: space-between; color: var(--text-tertiary); font-size: 12px; }
    .icon-row { display: flex; gap: 2px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const sites = [
      { name: 'OpenAI 主线路', meta: '6 个模型 · 全部正常', on: true, state: 'success' },
      { name: 'Claude 备用线路', meta: '4 个模型 · 1 个异常', on: true, state: 'error' },
      { name: 'Gemini 亚洲线路', meta: '3 个模型 · 响应偏慢', on: true, state: 'warning' },
      { name: '本地 Ollama', meta: '0 个模型启用 · 不参与探测', on: true, state: 'muted' },
      { name: '旧代理节点', meta: '站点已停用', on: false, state: 'muted' }
    ];

    const iconButton = (text, title) => `<button class="btn icon" title="${title}">${text}</button>`;
    const toggle = on => `<span class="switch ${on ? 'on' : ''}"></span>`;
    const tag = (text, type = '') => `<span class="tag ${type}">${text}</span>`;

    function titlebar() {
      return `<div class="titlebar">
        <div class="brand"><span class="brand-mark">⌁</span>RelayPulse</div>
        <div class="titlebar-center">模型可用性探针</div>
        <div class="titlebar-spacer" aria-hidden="true"></div>
      </div>`;
    }
    function nav(active = 'sites') {
      return `<aside class="nav">
        <div class="nav-section-label">配置</div>
        <div class="nav-item ${active === 'sites' ? 'active' : ''}"><span class="nav-icon">◉</span>站点管理</div>
        <div class="nav-item ${active === 'general' ? 'active' : ''}"><span class="nav-icon">⚙</span>通用设置</div>
        <div class="nav-section-label" style="margin-top:12px">运行</div>
        <div class="nav-item"><span class="nav-icon">◷</span>探测记录</div>
        <div class="nav-spacer"></div>
        <div class="nav-item"><span class="nav-icon">?</span>帮助与反馈</div>
        <div class="nav-version">RelayPulse 0.1.0</div>
      </aside>`;
    }
    function shell(content, active = 'sites') {
      return `<main class="screen desktop">${titlebar()}<div class="app-body">${nav(active)}<section class="content">${content}</section></div></main>`;
    }
    function pageHeader(title, subtitle, action = '') {
      return `<header class="page-header"><div><h1>${title}</h1><div class="subtitle">${subtitle}</div></div><div class="actions">${action}</div></header>`;
    }
    function siteList(selected = 0) {
      return `<aside class="site-list">
        <div class="site-list-head"><div><strong>站点</strong> <span class="site-count">${sites.length}</span></div><button class="btn icon small" title="添加站点">＋</button></div>
        ${sites.map((s, i) => `<div class="site-item ${selected === i ? 'active' : ''}">
          <span class="drag">⠿</span>
          <div><div class="site-name"><span class="status-dot ${s.state}"></span>${s.name}<span class="priority">${i + 1}</span></div><div class="site-meta">${s.meta}</div></div>
          ${toggle(s.on)}
        </div>`).join('')}
        <div class="effective-tip"><span>ⓘ</span><span>拖动调整优先级；停用或没有启用模型的站点不会参与探测。</span></div>
      </aside>`;
    }
    function modelTable() {
      const rows = [
        ['gpt-5.4-mini', '已启用', '自动 · 关闭思考', '278 ms', '1.12 s', 'green'],
        ['gpt-5.4', '已启用', '自动 · 最低推理', '421 ms', '1.84 s', 'green'],
        ['o3-mini', '已启用', '手动 · low', '693 ms', '2.36 s', 'orange'],
        ['gpt-4.1-mini', '已停用', '继承站点默认', '—', '—', 'gray']
      ];
      return `<div class="table model-table">
        <div class="tr header"><span>启用</span><span>模型</span><span>推理设置</span><span>首 Token</span><span>总耗时</span><span>操作</span></div>
        ${rows.map((r, i) => `<div class="tr"><span>${toggle(i < 3)}</span><span class="model-name">${r[0]}</span><span class="secondary">${r[2]}</span><span>${r[3]}</span><span>${r[4]}</span><span class="link">设置 ›</span></div>`).join('')}
      </div>`;
    }
    function siteDetail({ advanced = false } = {}) {
      return `<section class="detail"><div class="detail-scroll">
        <div class="detail-title"><div class="title-group"><span class="status-dot success"></span><h2>OpenAI 主线路</h2>${tag('优先级 1', 'blue')}${tag('运行中', 'green')}</div><button class="btn text">删除站点</button></div>
        ${advanced ? `<div class="banner"><span>ⓘ</span><span>高级设置仅在代理协议或网关字段不兼容时修改；常规 OpenAI 兼容站点保持默认即可。</span></div>` : ''}
        <section class="section">
          <div class="section-head"><div><h3>基本信息</h3><div class="section-note">站点名称、协议和访问凭据</div></div>${advanced ? '<button class="btn small">收起高级设置</button>' : '<button class="btn small">高级设置</button>'}</div>
          <div class="form-grid">
            <div class="field"><label>站点名称</label><input class="input" value="OpenAI 主线路" /></div>
            <div class="field"><label>接口协议</label><select class="select"><option>OpenAI 兼容</option></select></div>
            <div class="field"><label>Base URL</label><input class="input mono" value="https://api.openai.com/v1" /></div>
            <div class="field"><label>API Key</label><input class="input mono" value="sk-proj-••••••••••••••••" /></div>
          </div>
        </section>
        ${advanced ? `<section class="section">
          <div class="section-head"><div><h3>高级连接</h3><div class="section-note">端点、超时和自定义请求头</div></div></div>
          <div class="advanced-grid">
            <div class="field"><label>模型列表端点</label><input class="input mono" value="/models" /></div>
            <div class="field"><label>探测端点</label><input class="input mono" value="/chat/completions" /></div>
            <div class="field"><label>首 Token 超时</label><input class="input" value="8 秒" /></div>
            <div class="field"><label>请求总超时</label><input class="input" value="30 秒" /></div>
          </div>
          <div style="height:14px"></div>
          <div class="table key-table"><div class="tr header"><span>请求头</span><span>值</span><span></span></div><div class="tr"><span class="mono">X-Workspace</span><span class="mono secondary">relaypulse-prod</span><span class="muted">×</span></div><div class="tr"><span class="link">＋ 添加请求头</span><span></span><span></span></div></div>
        </section>` : `<section class="section">
          <div class="section-head"><div><h3>默认探针策略</h3><div class="section-note">新启用模型默认继承；单个模型可覆盖</div></div><button class="btn small">编辑默认值</button></div>
          <div class="strategy"><div class="strategy-icon">↯</div><div class="strategy-copy"><div class="strategy-name">极省模式</div><div class="strategy-meta">优先关闭思考，否则使用最低推理 · 最多输出 8 tokens · 只回复 OK</div></div>${tag('推荐', 'green')}</div>
        </section>
        <section class="section">
          <div class="section-head"><div><h3>模型探针</h3><div class="section-note">3 / 4 个模型已启用</div></div><div class="actions"><button class="btn small">同步模型</button><button class="btn primary small">＋ 添加模型</button></div></div>
          ${modelTable()}
        </section>`}
        <div class="page-footer"><button class="btn">放弃更改</button><button class="btn primary">保存站点</button></div>
      </div></section>`;
    }
    function sitesPage(opts = {}) {
      const base = `${pageHeader('站点管理', '配置多个模型站点，并通过拖动顺序决定故障时的优先级', '<button class="btn primary">＋ 添加站点</button>')}<div class="site-layout">${siteList(0)}${siteDetail(opts)}</div>`;
      return shell(base);
    }

    function trayHealthy() {
      return `<div class="tray-stage"><div class="tray healthy">
        <div class="tray-head"><div class="tray-brand"><span class="brand-mark" style="width:22px;height:22px;font-size:13px">⌁</span>RelayPulse</div><div class="tray-actions">${iconButton('↻','立即探测')}${iconButton('⚙','打开设置')}</div></div>
        <div class="tray-main"><div class="healthy-line"><span class="state-light"></span><div><div class="healthy-title">全部正常</div><div class="healthy-meta">3 个站点 · 13 个模型正在探测</div></div></div></div>
        <div class="tray-foot"><span>刚刚完成探测</span><span>下一次 1 分钟后</span></div>
      </div></div>`;
    }
    function trayAlerts() {
      const rows = [
        ['error','claude-3-7-sonnet','Claude 备用线路','超时','8.00 s','bad'],
        ['warning','gemini-2.5-pro','Gemini 亚洲线路','1.82 s','6.41 s','slow'],
        ['error','o3-mini','OpenAI 主线路','693 ms','失败','bad']
      ];
      return `<div class="tray-stage"><div class="tray alerts">
        <div class="tray-head"><div class="tray-brand"><span class="brand-mark" style="width:22px;height:22px;font-size:13px">⌁</span>RelayPulse</div><div class="tray-actions">${iconButton('↻','立即探测')}${iconButton('⚙','打开设置')}</div></div>
        <div class="tray-main"><div class="tray-summary"><div class="summary-title"><span class="state-light error"></span>3 个异常</div><span class="summary-meta">按站点优先级排序</span></div>
          ${rows.map(r => `<div class="probe-row"><div class="probe-id"><span class="status-dot ${r[0]}" style="margin-top:6px"></span><div style="min-width:0"><div class="probe-name">${r[1]}</div><div class="probe-site">${r[2]}</div></div></div><div class="metric"><div class="metric-label">首 Token</div><div class="metric-value ${r[5]}">${r[3]}</div></div><div class="metric"><div class="metric-label">总耗时</div><div class="metric-value ${r[5]}">${r[4]}</div></div></div>`).join('')}
        </div>
        <div class="tray-link">查看全部 5 个异常 ›</div><div class="tray-foot"><span>刚刚完成探测</span><span>下一次 1 分钟后</span></div>
      </div></div>`;
    }
    function addSite() {
      const modal = `<div class="overlay"><div class="modal"><div class="modal-head"><h2>添加站点</h2><span class="close">×</span></div><div class="modal-body"><div class="form-grid">
        <div class="field"><label>站点名称</label><input class="input" placeholder="例如：OpenAI 主线路" /></div>
        <div class="field"><label>接口协议</label><select class="select"><option>OpenAI 兼容</option><option>Anthropic</option><option>Gemini</option></select></div>
        <div class="field"><label>Base URL</label><input class="input mono" placeholder="https://api.example.com/v1" /></div>
        <div class="field"><label>API Key</label><input class="input mono" placeholder="输入访问凭据" /></div>
        <div class="check-row"><span class="checkbox">✓</span><span>创建后立即启用站点</span></div>
      </div></div><div class="modal-footer"><button class="btn">取消</button><button class="btn primary">连接并获取模型</button></div></div></div>`;
      return sitesPage().replace('</section></div></main>', `${modal}</section></div></main>`);
    }
    function modelSettings() {
      const drawer = `<div class="drawer-overlay"><aside class="drawer"><div class="drawer-head"><div><h2>模型探针设置</h2><div class="subtitle">gpt-5.4 · OpenAI 主线路</div></div><span class="close">×</span></div>
        <div class="drawer-body">
          <section class="section"><div class="section-head"><div><h3>推理能力</h3><div class="section-note">用于判断可发送的推理参数</div></div></div><div class="capability">${tag('自动识别', 'blue')}${tag('支持关闭思考', 'green')}${tag('支持 low / medium / high')}</div></section>
          <section class="section"><div class="section-head"><div><h3>本模型探针策略</h3><div class="section-note">覆盖站点默认的“极省模式”</div></div></div>
            <div class="field"><label>推理模式</label><div class="radio-group"><span class="radio-btn">继承默认</span><span class="radio-btn active">关闭思考</span><span class="radio-btn">最低推理</span></div></div>
            <div class="form-grid" style="margin-top:14px"><div class="field"><label>最大输出</label><input class="input" value="8 tokens" /></div><div class="field"><label>探针提示词</label><input class="input" value="只回复 OK" /></div></div>
          </section>
          <section class="section"><div class="section-head"><div><h3>透传参数</h3><div class="section-note">仅添加服务商需要的额外字段</div></div><button class="btn small">＋ 添加参数</button></div>
            <div class="table param-table"><div class="tr header"><span>字段</span><span>值</span><span>类型</span><span></span></div><div class="tr"><input class="mini-input mono" value="reasoning_effort"/><input class="mini-input mono" value="none"/><span class="secondary">string</span><span class="muted">×</span></div><div class="tr"><input class="mini-input mono" value="store"/><input class="mini-input mono" value="false"/><span class="secondary">boolean</span><span class="muted">×</span></div></div>
            <div class="section-note" style="margin-top:8px">保留字段 model、messages、stream 由 RelayPulse 管理，不能覆盖。</div>
          </section>
          <section class="section"><div class="section-head"><div><h3>有效请求预览</h3><div class="section-note">保存后实际发送的最小请求</div></div></div><div class="code-preview">{
  "model": "gpt-5.4",
  "messages": [{ "role": "user", "content": "只回复 OK" }],
  "stream": true,
  "max_output_tokens": 8,
  "reasoning_effort": "none",
  "store": false
}</div></section>
        </div><div class="drawer-footer"><button class="btn">恢复继承</button><button class="btn">取消</button><button class="btn primary">保存设置</button></div></aside></div>`;
      return sitesPage().replace('</section></div></main>', `${drawer}</section></div></main>`);
    }
    function generalSettings() {
      const content = `${pageHeader('通用设置','控制 RelayPulse 的系统行为、外观与本地数据')}<div class="settings-wrap">
        <section class="settings-section"><h2>启动与后台</h2>
          <div class="settings-row"><div class="settings-copy"><div class="settings-title">开机自动启动</div><div class="settings-help">登录系统后自动在状态栏运行 RelayPulse</div></div>${toggle(true)}</div>
          <div class="settings-row"><div class="settings-copy"><div class="settings-title">关闭主窗口后继续运行</div><div class="settings-help">关闭配置窗口时保留状态栏图标和后台探测</div></div>${toggle(true)}</div>
          <div class="settings-row"><div class="settings-copy"><div class="settings-title">状态栏图标操作</div><div class="settings-help">选择单击状态栏图标时显示的内容</div></div><select class="select compact-select"><option>打开状态小面板</option></select></div>
        </section>
        <section class="settings-section"><h2>外观与语言</h2>
          <div class="settings-row"><div class="settings-copy"><div class="settings-title">主题</div><div class="settings-help">跟随系统时会自动切换浅色和深色模式</div></div><div class="segmented"><span class="segment active">跟随系统</span><span class="segment">浅色</span><span class="segment">深色</span></div></div>
          <div class="settings-row"><div class="settings-copy"><div class="settings-title">界面语言</div></div><select class="select compact-select"><option>简体中文</option></select></div>
        </section>
        <section class="settings-section"><h2>本地数据</h2>
          <div class="settings-row"><div class="settings-copy"><div class="settings-title">探测记录保留时间</div><div class="settings-help">过期记录会自动清理，不影响站点和模型配置</div></div><select class="select compact-select"><option>保留 30 天</option></select></div>
          <div class="settings-row"><div class="settings-copy"><div class="settings-title">诊断日志</div><div class="settings-help">日志保存在本机，不包含 API Key 明文</div></div><div class="actions"><button class="btn">打开日志目录</button><button class="btn">导出诊断包</button></div></div>
        </section>
        <div class="page-footer"><button class="btn primary">保存设置</button></div>
      </div>`;
      return shell(content, 'general');
    }
    function deleteConfirm() {
      const modal = `<div class="overlay"><div class="modal small-modal"><div class="modal-body" style="padding:24px"><div class="confirm-body"><div class="danger-icon">!</div><div class="confirm-copy"><h2>删除“OpenAI 主线路”？</h2><p>将同时删除该站点的 4 个模型配置和本地探测记录。此操作无法撤销。</p></div></div></div><div class="modal-footer"><button class="btn">取消</button><button class="btn primary" style="background:var(--error);border-color:var(--error)">删除站点</button></div></div></div>`;
      return sitesPage().replace('</section></div></main>', `${modal}</section></div></main>`);
    }
    function emptyState() {
      const content = `${pageHeader('站点管理','添加并管理需要持续探测的模型站点','<button class="btn primary">＋ 添加站点</button>')}<div class="empty-wrap"><div class="empty"><div class="empty-art"><div class="empty-window"></div><div class="empty-plus">＋</div></div><h2>还没有站点</h2><p>先添加一个 OpenAI、Anthropic、Gemini 或兼容协议站点，连接成功后即可选择需要探测的模型。</p><button class="btn primary">＋ 添加第一个站点</button></div></div>`;
      return shell(content);
    }

    const views = {
      'tray-healthy': trayHealthy,
      'tray-alerts': trayAlerts,
      'sites': () => sitesPage(),
      'add-site': addSite,
      'site-advanced': () => sitesPage({ advanced: true }),
      'model-settings': modelSettings,
      'general': generalSettings,
      'delete-confirm': deleteConfirm,
      'empty': emptyState
    };
    const view = new URLSearchParams(location.search).get('view') || 'sites';
    document.getElementById('app').innerHTML = (views[view] || views.sites)();
    document.body.dataset.view = view;
  </script>
</body>
</html>
