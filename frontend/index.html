<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RelayPulse</title>
    <script>
      if (window.location.pathname.replace(/\/+$/, '') === '/panel') {
        document.documentElement.dataset.surface = 'panel';
      }
    </script>
    <style>
      /* Vue 实例挂载前的静态加载页：不依赖任何构建产物，挂载后整块被 #app 内容替换。
       此时 Tailwind preflight 尚未加载，浏览器默认的 body 外边距会在加载页四周露白，
       故仅对 html/body 定向归零；禁止 `*` 通配 reset——无层规则会永久压过 Tailwind
       @layer 工具类（margin/padding）且挂载后不会移除。 */
      html,
      body {
        margin: 0;
        padding: 0;
      }

      html[data-surface='panel'],
      html[data-surface='panel'] body {
        background: transparent;
      }

      html[data-surface='panel'] .boot-loading {
        display: none;
      }

      .boot-loading {
        display: flex;
        height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f5f5f5;
        /* color: rgba(0, 0, 0, 0.88); */
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', sans-serif;
      }

      .boot-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(22, 119, 255, 0.2);
        border-top-color: #1677ff;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }

      .boot-title {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      .boot-hint {
        font-size: 13px;
        opacity: 0.55;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-color-scheme: dark) {
        .boot-loading {
          background: #141414;
          color: rgba(255, 255, 255, 0.85);
        }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="boot-loading">
        <div class="boot-spinner"></div>
        <div class="boot-title">RelayPulse</div>
        <div class="boot-hint">正在加载…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
